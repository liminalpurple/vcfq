name: Release

on:
  push:
    tags: ["v*"]


jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: |
          version="${GITHUB_REF_NAME}"
          ldflags="-s -w -X github.com/liminalpurple/vcfq/internal/cli.Version=${version}"

          GOOS=linux   GOARCH=amd64 go build -ldflags "${ldflags}" -o "dist/vcfq-linux-amd64" .
          GOOS=linux   GOARCH=arm64 go build -ldflags "${ldflags}" -o "dist/vcfq-linux-arm64" .
          GOOS=darwin  GOARCH=amd64 go build -ldflags "${ldflags}" -o "dist/vcfq-darwin-amd64" .
          GOOS=darwin  GOARCH=arm64 go build -ldflags "${ldflags}" -o "dist/vcfq-darwin-arm64" .
          GOOS=windows GOARCH=amd64 go build -ldflags "${ldflags}" -o "dist/vcfq-windows-amd64.exe" .
          GOOS=windows GOARCH=arm64 go build -ldflags "${ldflags}" -o "dist/vcfq-windows-arm64.exe" .

      # checkout leaves the tag as a bare commit, so fetch the annotated tag to
      # read its message. The body is hard-wrapped, and Forgejo renders single
      # newlines in release notes as line breaks, so wrapped lines are rejoined.
      - name: Read tag message
        id: notes
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}" | awk '
            /^$/  { if (buf != "") print buf; buf = ""; print ""; next }
            /^- / { if (buf != "") print buf; buf = $0; next }
            /^  +[^ ]/ && buf ~ /^- / { sub(/^ +/, ""); buf = buf " " $0; next }
                  { buf = (buf == "") ? $0 : buf " " $0 }
            END   { if (buf != "") print buf }' > NOTES.md
          {
            echo 'notes<<__NOTES__'
            cat NOTES.md
            echo '__NOTES__'
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}
          release-dir: dist
          release-notes: ${{ steps.notes.outputs.notes }}
